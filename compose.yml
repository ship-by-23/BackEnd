services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: simpandulu
      POSTGRES_USER: simpandulu
      POSTGRES_PASSWORD: simpandulu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpandulu -d simpandulu"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://simpandulu:simpandulu@postgres:5432/simpandulu
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://simpandulu:simpandulu@postgres:5432/simpandulu
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      DATABASE_MAX_CONNECTIONS: 10
      SHUTDOWN_TIMEOUT_MS: 20000
      ACCESS_TOKEN_SECRET: local-development-access-token-secret-change-me
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30
      JWT_ISSUER: simpandulu-api
      JWT_AUDIENCE: simpandulu-web
      BCRYPT_ROUNDS: 12
      AUTH_RATE_LIMIT_MAX: 20
      EXTRACTION_TIMEOUT_MS: 15000
      EXTRACTION_MAX_BYTES: 2000000
      EXTRACTION_MAX_REDIRECTS: 5
      EXTRACTION_POLL_INTERVAL_MS: 500
      EXTRACTION_STALE_LOCK_MS: 300000
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: simpandulu_test
      POSTGRES_USER: simpandulu
      POSTGRES_PASSWORD: simpandulu
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpandulu -d simpandulu_test"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
