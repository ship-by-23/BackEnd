services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: simpandulu
      POSTGRES_USER: simpandulu
      POSTGRES_PASSWORD: simpandulu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpandulu -d simpandulu"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://simpandulu:simpandulu@postgres:5432/simpandulu
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      DATABASE_MAX_CONNECTIONS: 10
      SHUTDOWN_TIMEOUT_MS: 10000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
