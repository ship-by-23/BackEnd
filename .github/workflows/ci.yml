name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: simpandulu_test
          POSTGRES_USER: simpandulu
          POSTGRES_PASSWORD: simpandulu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simpandulu -d simpandulu_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://simpandulu:simpandulu@localhost:5432/simpandulu_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to a fresh database
        run: DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate

      - name: Check formatting
        run: npm run format:check

      # The Vercel entrypoint imports generated dist/runtime.js.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
